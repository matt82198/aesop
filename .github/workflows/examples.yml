name: examples

# Purpose: Verify example manifests validate and example test commands are fail-closed

on:
  pull_request:
    branches: [main]
    paths:
      - examples/**
      - tools/wave_templates.py
  push:
    branches: [main]
    paths:
      - examples/**
      - tools/wave_templates.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Validate wave manifest
        run: python tools/wave_manifest_lint.py examples/first-wave-baseline/wave-manifest.json

      - name: Verify test commands are fail-closed
        run: bash examples/first-wave-baseline/verify-testcmds.sh
