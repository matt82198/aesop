name: Weekly Cross-OS Drift Snapshot

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crossos-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run cross-OS drift analysis with exit-code handling
        run: |
          # Run JSON output
          python tools/crossos_drift.py --runs 20 --json > docs/CROSSOS-DRIFT.json
          json_exit=$?

          # Run Markdown output
          python tools/crossos_drift.py --runs 20 > docs/CROSSOS-DRIFT.md
          md_exit=$?

          # Handle exit codes:
          # Exit 3 = auth failure (skip commit, exit 0 to not fail scheduled run)
          # Any other non-zero = actual failure (fail the workflow)

          if [ "$json_exit" -eq 3 ] || [ "$md_exit" -eq 3 ]; then
            echo "WARNING: Authentication failure (exit 3); skipping commit"
            rm -f docs/CROSSOS-DRIFT.json docs/CROSSOS-DRIFT.md
            exit 0
          fi

          if [ "$json_exit" -ne 0 ]; then
            echo "ERROR: JSON drift analysis failed with exit code $json_exit"
            exit 1
          fi

          if [ "$md_exit" -ne 0 ]; then
            echo "ERROR: Markdown drift analysis failed with exit code $md_exit"
            exit 1
          fi

          # Verify both files exist and are non-empty
          if [ ! -s docs/CROSSOS-DRIFT.json ] || [ ! -s docs/CROSSOS-DRIFT.md ]; then
            echo "ERROR: Output files missing or empty"
            exit 1
          fi

          echo "Cross-OS drift snapshot generated successfully"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push if changed
        run: |
          git add docs/CROSSOS-DRIFT.json docs/CROSSOS-DRIFT.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): weekly cross-OS drift snapshot"
            git push
          else
            echo "No changes to commit"
          fi
