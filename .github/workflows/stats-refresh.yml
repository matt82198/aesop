name: Stats Refresh

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # ONE long-lived branch, not one per day. Every run replaces its content, so
  # refreshes coalesce into a single open PR instead of accumulating an orphan
  # branch per night (chore/stats-refresh-2026-07-30..08-02 are the fossils of
  # the date-suffixed scheme; leave them for a janitor pass).
  STATS_BRANCH: chore/stats-refresh
  FAILURE_ISSUE_TITLE: 'CI: stats-refresh workflow is failing'

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Regenerate stats
        run: bash scripts/verify-stats.sh --regenerate

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet README.md stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in stats files."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in stats files:"
            git diff --stat README.md stats.json
          fi

      - name: Commit onto the coalescing stats branch
        if: steps.check.outputs.changed == 'true'
        run: |
          set -eu
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Learn the remote tip (if any) so the push below can take a real lease.
          git fetch --no-tags origin "+refs/heads/${STATS_BRANCH}:refs/remotes/origin/${STATS_BRANCH}" || true
          # Point the branch at the freshly-regenerated main tree; -B keeps the
          # working-tree changes made by the regenerate step above.
          git checkout -B "${STATS_BRANCH}"
          git add README.md stats.json
          git commit -m "chore(stats): scheduled refresh" -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Push branch
        if: steps.check.outputs.changed == 'true'
        run: |
          set -eu
          # --force-with-lease with no remote-tracking ref is rejected as "stale
          # info", so compute the lease explicitly: leased force when the branch
          # already exists, plain create when it does not.
          LEASE="$(git rev-parse --verify --quiet "refs/remotes/origin/${STATS_BRANCH}" || true)"
          if [ -n "$LEASE" ]; then
            git push --force-with-lease="refs/heads/${STATS_BRANCH}:${LEASE}" origin "HEAD:refs/heads/${STATS_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${STATS_BRANCH}"
          fi

      - name: Create or update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          BODY="Automated stats refresh from the scheduled stats-refresh workflow.

          README.md and stats.json regenerated from current git state via
          'bash scripts/verify-stats.sh --regenerate'.

          This branch coalesces: every scheduled run force-updates ${STATS_BRANCH},
          so there is exactly one open stats PR at a time.

          Run: ${RUN_URL}"

          PR_URL="$(gh pr list --state open --head "${STATS_BRANCH}" --json url -q '.[0].url' || true)"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body "$BODY"
            echo "Updated existing PR: $PR_URL"
          else
            PR_URL="$(gh pr create \
              --title "chore(stats): scheduled refresh" \
              --body "$BODY" \
              --head "${STATS_BRANCH}" \
              --base main)"
            echo "Created PR: $PR_URL"
          fi

          # Labels are cosmetic and MUST NOT be load-bearing. Passing --label to
          # 'gh pr create' made them load-bearing: gh resolves labels BEFORE it
          # opens the PR, so a missing 'chore' label failed the whole job and no
          # PR was ever created (2026-07-30..08-02, four silent nights).
          # Attach them after the fact, best-effort.
          gh pr edit "$PR_URL" --add-label chore || echo "note: could not add label 'chore' (non-fatal)"
          # merge-queue hands the refresh to the merge-queue advancer daemon so a
          # routine stats bump does not need a human on high-velocity days.
          gh pr edit "$PR_URL" --add-label merge-queue || echo "note: could not add label 'merge-queue' (non-fatal)"

      # --- failure visibility -------------------------------------------------
      # Nothing watches a scheduled workflow's conclusion, so this job failed on
      # four consecutive nights with no signal at all while stats.json drifted
      # 200+ commits stale and red-lined the freshness gate on every open PR.
      # An issue is the cheapest honest alarm available to GITHUB_TOKEN here: it
      # needs no push access and no branch-protection exception, it survives log
      # retention, and it is deduplicated so repeat failures comment instead of
      # spamming. The success path closes it again so the signal stays truthful.
      - name: Close failure tracking issue on success
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          NUM="$(gh issue list --state open --limit 100 --json number,title \
            -q "[.[] | select(.title == \"${FAILURE_ISSUE_TITLE}\") | .number][0]" || true)"
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue close "$NUM" --comment "stats-refresh is green again: ${RUN_URL}"
          fi

      - name: Surface failure as a tracking issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          NUM="$(gh issue list --state open --limit 100 --json number,title \
            -q "[.[] | select(.title == \"${FAILURE_ISSUE_TITLE}\") | .number][0]" || true)"
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "${FAILURE_ISSUE_TITLE}" \
              --body "The scheduled stats-refresh workflow failed.

          Until it is fixed, stats.json goes stale and the stats freshness gate
          red-lines every open PR in the repo.

          Failing run: ${RUN_URL}"
          fi
