name: CI

# NOTE: `ci` runs on EVERY PR, including docs-only. We deliberately do NOT skip it on docs-only
# changes: a skipped matrix job reports its `ci (N)` checks as *skipped*, and under strict branch
# protection a skipped required check is NOT satisfied, so pure-docs PRs deadlock forever (observed
# 2026-07-17 on PR #170 — even `--admin` fails with "N of N required status checks are expected").
# Running the full suite on a docs-only change is cheap enough and always passes (code is unchanged),
# so correctness beats the few saved minutes. Do NOT re-add a job-level `if:` skip on `ci` or a
# trigger-level `paths-ignore:` — either one reintroduces the deadlock.
# Scoping must remain STEP-LEVEL: individual gates can be conditional (e.g., shard 0 only) without
# causing matrix jobs to report skipped. This approach preserves deadlock safety while allowing
# incremental gate optimization (browser-proofs and windows-shard skip safely as non-required).
#
# GAP (found 2026-10-05, ~8h of armed PRs stuck unmerged): the `needs: docs-only-gate` edge on
# `ci`/`windows-shard`/`browser-proofs` reintroduces the SAME deadlock via a different path, with
# no job-level `if:` skip and no `paths-ignore:` in sight. GitHub Actions implicitly prepends
# `success() &&` to any job's scheduling decision when it has a `needs:` entry, UNLESS that job's
# own `if:` explicitly calls always()/cancelled()/failure(). So whenever docs-only-gate itself does
# not conclude "success" — a genuine script bug, OR (as observed) the job sitting queued and then
# getting cancelled by runner/concurrency starvation, with zero steps ever executing — `ci` reports
# `skipped` on all 4 shards and `windows-shard` also skips (which the `windows` aggregator then
# treats as an acceptable "correctly skipped for docs-only," turning a Windows run that never
# happened into a false green). Required contexts "ci (0..3)"/"windows" must always conclude
# success or failure, never skipped, REGARDLESS of why docs-only-gate failed to resolve — hence
# `if: always() && (needs.docs-only-gate.result != 'success' || ...)` on all three downstream jobs.
# Do not remove always() from any of them; without it the implicit success()-gate comes back.
#
# PR-only by design. `push: branches: [main]` was removed: main is protected by PR
# checks, so the merge commit's `ci` run already passed on the PR, and .github/workflows/
# main-full.yml is the post-merge verification (that is why it exists — see its header).
# Keeping both meant every merge paid the full ~30 job-minutes twice. Do NOT re-add a
# push trigger here; post-merge coverage belongs to main-full.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full CI matrix (03:30 UTC): drift guard for Windows shard de-collection,
    # flaky luck-passes, and skip-path classes
    - cron: '30 3 * * *'

concurrency:
  # Cancel in-progress runs on PR branches (superseded pushes waste runners).
  # Scoped by branch: multiple PRs can run concurrently, and post-merge runs on main never cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-only-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: is-docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1...HEAD)
          fi
          if echo "$CHANGED" | grep -qvE '(\.md$|docs/|^CHANGELOG|^LICENSE|\.gitignore)'; then
            echo "is_docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "is_docs_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.is-docs-only.outputs.is_docs_only == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Lightweight secret scan (docs-only)
        if: steps.is-docs-only.outputs.is_docs_only == 'true'
        run: python tools/secret_scan.py .

    outputs:
      is_docs_only: ${{ steps.is-docs-only.outputs.is_docs_only }}

  windows-sensitive-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Windows-sensitive changes
        id: windows-touched
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # On workflow_dispatch and schedule, run Windows (conservative)
            echo "windows_touched=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Check for Windows-sensitive paths (OS-specific behavior only):
          # - daemons/** (daemon scripts, Windows service)
          # - hooks/** (pre-push enforcement, PowerShell/bash mix)
          # - **/*.ps1, **/*.sh (shell scripts, OS-specific interpreters)
          # - bin/** (CLI entry points, npm scripts platform-specific)
          # - package.json, package-lock.json (npm, PATH handling differs)
          # - ui/web/** (vite build outputs, line ending sensitivity)
          # - .github/workflows/** (CI configuration)
          # - specific tools/ files with OS-specific behavior:
          #   ci_shard_runner.py, halt.py, test_isolation_tripwire.py,
          #   remote_refs_tripwire.py, test_network_isolation.py,
          #   subprocess_common.py, encoding_lint.py, power_selftest.py,
          #   hook_preflight.py, task_cadence_check.py, build_static_dash.py
          if echo "$CHANGED" | grep -qE '^(daemons/|hooks/|bin/|ui/web/|\.github/workflows/)|\.ps1$|\.sh$|^package(-lock)?\.json$|^tools/(ci_shard_runner|halt|test_isolation_tripwire|remote_refs_tripwire|test_network_isolation|subprocess_common|encoding_lint|power_selftest|hook_preflight|task_cadence_check|build_static_dash)\.py$'; then
            echo "windows_touched=true" >> $GITHUB_OUTPUT
          else
            echo "windows_touched=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      windows_touched: ${{ steps.windows-touched.outputs.windows_touched }}

  ci:
    needs: docs-only-gate
    # if: always() is load-bearing, not decorative. Without it, GitHub Actions
    # implicitly prepends `success() &&` to a job's scheduling decision whenever
    # it has a `needs:` entry and no `if:` says otherwise -- so ANY non-success
    # conclusion of docs-only-gate (a real script failure, a cancellation from
    # the runner/concurrency queue, a timeout) makes `ci` report `skipped`
    # instead of running, which is the exact deadlock this file's top comment
    # warns about (a skipped required check can never satisfy branch
    # protection). `ci` must run on every PR unconditionally per that comment;
    # always() is what actually enforces "unconditional" against a failed
    # upstream job, not just an `if:`-skipped one. Do not remove.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On pull_request, check out the PR HEAD commit (not the merge commit).
          # This ensures a red main never turns every PR red; main-full + regen-on-main
          # own post-merge integration. Fixes: a red main would make the PR's ci checks
          # red even though the PR code is unrelated to the breakage.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python test dependencies
        # PyYAML is required by tools/ci_workflow_lint.py (fail-closed without it)
        # and its test suite tests/test_ci_workflow_lint.py.
        # pytest is required by tests/test_seam_s_e2e_oracle.py subprocess tests.
        run: pip install pyyaml pytest

      - name: Set shard-specific temporary directory
        run: |
          mkdir -p /tmp/shard-${{ matrix.python-shard }}
          echo "TMPDIR=/tmp/shard-${{ matrix.python-shard }}" >> $GITHUB_ENV

      - name: Configure git (required for hook installation tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Node syntax check
        run: |
          # *.template.mjs are Claude Code WORKFLOW scripts (top-level return is valid
          # in the harness runtime, illegal to plain node) — structurally tested in
          # tests/buildsystem-template.test.mjs instead.
          git ls-files '*.mjs' | grep -v '\.template\.mjs$' | while read file; do
            node --check "$file" || exit 1
          done

      - name: Shell syntax check
        run: |
          git ls-files '*.sh' | while read file; do
            bash -n "$file" || exit 1
          done

      - name: Test coverage gate (Guardrail G2)
        if: matrix.python-shard == 0
        run: python tools/verify_test_coverage.py --check

      - name: Run Node.js tests
        run: npm run test:node

      - name: Run shell test suites
        run: npm run test:sh

      - name: Tool import/compile/UTF-8 smoke gate
        run: |
          python -m compileall -q tools/
          python -m unittest tests.test_tools_importable -v

      - name: CLAUDE.md linter gate (scope invariant)
        if: matrix.python-shard == 0
        run: python tools/claudemd_lint.py --root .

      - name: CLAUDE.md sync gate (Guardrail G5)
        if: matrix.python-shard == 0 && github.event_name == 'pull_request'
        run: python tools/claudemd_sync_gate.py --check

      - name: Tool index sync gate
        if: matrix.python-shard == 0
        run: python tools/gen_tool_index.py --check

      - name: Install actionlint (GitHub-semantics workflow validator)
        if: matrix.python-shard == 0
        # Pinned release via the official downloader. GAP 2026-10-06: PyYAML-valid
        # main-full.yml was rejected by GitHub ("Unexpected value 'exclude'") and
        # ran ZERO jobs for ~10 merges; actionlint flags that class at PR time.
        run: |
          mkdir -p "$HOME/.local/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" -version

      - name: CI workflow linter gate (fail-closed)
        if: matrix.python-shard == 0
        env:
          # Structural GitHub-semantics checks always run; in CI actionlint is mandatory too.
          CI_WORKFLOW_LINT_REQUIRE_ACTIONLINT: '1'
        run: python tools/ci_workflow_lint.py

      - name: CI gates runability check (Guardrail G2.5)
        if: matrix.python-shard == 0
        run: python tools/ci_gate_runability.py

      - name: Needs-skip-cascade guard (required checks never skip on upstream failure)
        if: matrix.python-shard == 0
        run: python tools/ci_needs_skip_guard.py
      - name: Workflow model linter
        if: matrix.python-shard == 0
        run: python tools/workflow_model_linter.py


      - name: Documented gates wiring check (Guardrail G2.6)
        if: matrix.python-shard == 0
        run: python tools/verify_gates_wired.py

      - name: State API lint gate (ratchet mode)
        if: matrix.python-shard == 0
        run: python tools/stateapi_lint.py

      - name: Watcher/polling anti-pattern gate (Guardrail G3)
        if: matrix.python-shard == 0
        run: python tools/watcher_linter.py --check

      - name: Spec-contract dispatch gate (Guardrail G4)
        if: matrix.python-shard == 0
        run: python tools/spec_contract_validator.py --check

      - name: Subprocess anti-pattern gate (Guardrail G6, ratchet mode)
        if: matrix.python-shard == 0
        run: python tools/subprocess_guard.py --check --baseline .subprocess-guard-baseline.json

      - name: Agent prompt hygiene gate
        if: matrix.python-shard == 0
        run: python tools/agent_prompt_hygiene.py .

      - name: Portability gate (ratchet mode)
        if: matrix.python-shard == 0
        run: python tools/portability_check.py --root . --baseline .portability-baseline.json

      - name: Dead-baseline liveness gate (GUARDRAIL #3)
        if: matrix.python-shard == 0
        run: python tools/baseline_liveness_check.py --root .

      - name: Wave templates validation gate
        if: matrix.python-shard == 0
        run: python tools/wave_templates.py validate --template all

      - name: Sibling import guard (tools/ sys.path discipline)
        if: matrix.python-shard == 0
        run: python tools/sibling_import_check.py --check

      - name: Deliberately-broken fixture manifest gate
        if: matrix.python-shard == 0
        run: python tools/fixture_intent_check.py --root .

      - name: Port-task fidelity gate
        if: matrix.python-shard == 0
        run: python tools/port_fidelity_check.py --check --root .

      - name: Run Python tests (shard ${{ matrix.python-shard }}/4)
        run: python tools/remote_refs_tripwire.py --attributed -- python tools/ci_shard_runner.py ${{ matrix.python-shard }} 4 --timing-file .github/shard-timing.json

      # The ui/web chain below is shard-INVARIANT: all four ubuntu shards ran the same
      # npm ci + build + tsc + dist-drift + vitest, so 3 of every 4 runs were pure waste.
      # Gate is STEP-level on purpose — a job-level `if:` makes `ci (N)` report skipped,
      # and a skipped required check never satisfies branch protection (PR #170 deadlock).
      - name: Build React dashboard (ui/web/)
        if: matrix.python-shard == 0
        run: |
          cd ui/web
          npm ci
          npm run build

      - name: TypeScript type check (ui/web/)
        if: matrix.python-shard == 0
        run: |
          cd ui/web
          npx tsc --noEmit

      - name: Dist drift gate (committed ui/web/dist must match fresh build)
        if: matrix.python-shard == 0
        run: |
          cd ui/web
          git diff --exit-code -- dist/
          git diff --cached --exit-code -- dist/

      - name: Run React component tests (vitest)
        if: matrix.python-shard == 0
        run: |
          cd ui/web
          npx vitest run

      - name: NO-UNVERIFIED-METRICS gate (PR)
        if: github.event_name == 'pull_request' && matrix.python-shard == 0
        run: python tools/metrics_gate.py origin/main...HEAD

      - name: README stats freshness gate
        if: matrix.python-shard == 0
        run: python tools/self_stats.py --check

      - name: Tracker auto-close gate (Guardrail G1)
        if: matrix.python-shard == 0
        run: python tools/tracker_autoclose.py --check

      - name: CI shard coverage gate
        if: matrix.python-shard == 0
        run: python tools/verify_test_suite_count.py --check

      - name: UI trio redaction proof (falsifiability)
        if: matrix.python-shard == 0
        run: python tools/verify_ui_trio_redaction_proof.py

      - name: Secret scan
        if: matrix.python-shard == 0
        run: python tools/secret_scan.py .

  windows-shard:
    needs: [docs-only-gate, windows-sensitive-paths]
    # On pull_request, run only if Windows-sensitive paths are touched, OR if docs-only-gate
    # failed (fail-open on upstream failure). On workflow_dispatch/schedule, always run
    # (Windows matrix must verify all paths in those triggers). The leading always() is required
    # to prevent implicit success()-gating when we have a `needs:` entry.
    if: |
      always() && (needs.docs-only-gate.result != 'success' || needs.docs-only-gate.outputs.is_docs_only != 'true') &&
      (github.event_name != 'pull_request' || needs.windows-sensitive-paths.outputs.windows_touched == 'true')
    # Sharded test suite: runs Node tests (shard 0 only) and Python tests distributed 4-way
    # Excludes: shell test suite (Git Bash variance on Windows), browser proofs (Playwright setup cost)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      # Full parallelism with per-test timeout guards (PYTEST_TIMEOUT) — contention-prone tests
      # fail individually via pytest-timeout instead of hanging the whole shard.
      matrix:
        python-shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request, check out the PR HEAD commit (not the merge commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python test dependencies
        run: pip install pyyaml pytest pytest-timeout

      - name: Set shard-specific temporary directory
        run: |
          if (!(Test-Path "$env:TEMP\shard-${{ matrix.python-shard }}" -PathType Container)) { New-Item -ItemType Directory -Path "$env:TEMP\shard-${{ matrix.python-shard }}" }
          echo "TMPDIR=$env:TEMP\shard-${{ matrix.python-shard }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Node.js tests (shard 0 only)
        if: matrix.python-shard == 0
        env:
          AESOP_TEST_CHILD_TIMEOUT_MS: '120000'
        run: node --test --test-force-exit --test-timeout=180000 tests/*.test.mjs

      - name: Run Python tests (shard ${{ matrix.python-shard }}/4, PYTHONUTF8=1 for Windows encoding)
        env:
          PYTHONUTF8: '1'
          PYTEST_TIMEOUT: '120'
        shell: bash
        run: python tools/remote_refs_tripwire.py --attributed -- python tools/ci_shard_runner.py ${{ matrix.python-shard }} 4 --timing-file .github/shard-timing.json

  windows:
    # Aggregator job: enforces that all windows-shard shards succeeded or were skipped.
    # Keeps the required check name for branch protection (no config change needed).
    # Always reports a conclusion (success when matrix was intentionally skipped on pull_request).
    needs: [windows-shard, windows-sensitive-paths]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Resolve Windows run result
        run: |
          # On pull_request with no Windows-sensitive changes, windows-shard is skipped
          # (via job-level if:). Report success for the aggregator in that case.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.windows-sensitive-paths.outputs.windows_touched }}" != "true" ]; then
            echo "Windows-sensitive paths not touched on PR; skipped (expected)"
            exit 0
          fi
          # Otherwise, windows-shard ran: check its result
          if [ "${{ needs.windows-shard.result }}" != "success" ]; then
            echo "One or more Windows shards failed"
            exit 1
          fi

  ps1-syntax-check:
    # PowerShell syntax validation: ensures all *.ps1 files are parseable.
    # Runs on Windows to use native PowerShell Parser.
    # Does not block PR (not a required check); branch protection config unchanged.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          & ".\tools\check-ps1-syntax.ps1" -RepoRoot "."

  browser-proofs:
    needs: docs-only-gate
    # Same fail-open rationale as windows-shard above: always() prevents the
    # implicit success()-gating GitHub Actions adds to any needs-gated `if:`,
    # so a failed/cancelled docs-only-gate still lets browser-proofs run
    # instead of silently skipping.
    if: always() && (needs.docs-only-gate.result != 'success' || needs.docs-only-gate.outputs.is_docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Build React dashboard (ui/web/)
        run: |
          cd ui/web
          npm ci
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install npm dependencies (for Playwright TypeScript specs)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright specs (npx playwright test)
        run: npx playwright test

      - name: Install Python Playwright (for Python browser proofs)
        run: pip install playwright && playwright install chromium

      - name: Run dashboard browser proof (verify_dash)
        run: python tools/verify_dash.py

      - name: Run submit encoding browser proof (verify_submit_encoding)
        run: python tools/verify_submit_encoding.py

      - name: Run prboard browser proof (verify_prboard)
        run: python tools/verify_prboard.py

      - name: Run agent inspector browser proof (verify_agent_inspector)
        run: python tools/verify_agent_inspector.py

      - name: Run activity filter browser proof (verify_activity_filter)
        run: python tools/verify_activity_filter.py

      - name: Run failure drilldown browser proof (verify_failure_drilldown)
        run: python tools/verify_failure_drilldown.py

      - name: Run wave telemetry browser proof (verify_wave_telemetry)
        run: python tools/verify_wave_telemetry.py

      - name: Run dispatch panel browser proof (verify_dispatch_panel)
        run: python tools/verify_dispatch_panel.py

      - name: Run scorecards browser proof (verify_scorecards)
        run: python tools/verify_scorecards.py

      - name: Run UI trio browser proof (verify_ui_trio)
        run: python tools/verify_ui_trio.py

      - name: Run cost panel browser proof (verify_cost_panel)
        run: python tools/verify_cost_panel.py

      - name: Run cost summary drawer browser proof (verify_cost_summary_drawer)
        run: python tools/verify_cost_summary_drawer.py

      - name: Run watchdog GUI tests
        run: bash tests/dash-watchdog-gui.test.sh
