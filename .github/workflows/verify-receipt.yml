name: verify-receipt

# RECEIPT GATE -- increment 3 (measurement period, NON-required).
#
# A lane that ran the local matrix posts a signed receipt on its head sha
# (`python tools/emit_receipt.py --post`: a `verify-receipt-local` check-run, or a
# commit comment when the token cannot create check-runs). This job fetches that
# receipt and verifies it OFFLINE with tools/verify_receipt.py, which recomputes the
# tree hash from THIS checkout (never trusts the lane's number), re-checks the
# signature against the committed public key, and binds freshness to origin/main.
#
# Behaviour during the measurement period (see docs/RECEIPT-GATE.md):
#   - no receipt on the head sha   -> job FAILS (fail-closed, exit 1, "MISSING receipt"
#                                     with the sha and where it was looked for). A green
#                                     check must mean a receipt was verified, not that
#                                     none was posted. Stays non-required (see below).
#   - receipt present and valid    -> job succeeds ("receipt VALID").
#   - receipt present but INVALID  -> job FAILS. A lane that posts a wrong/stale/forged
#                                     receipt is a real defect even while non-required.
#   - receipt present, cannot be evaluated (exit 2: malformed, unknown scheme, no key
#     material) -> job FAILS (fail-closed; doubt is not a pass).
#
# This workflow is deliberately NOT in ci.yml and NOT in the required-checks list
# (tools/merge_queue.EXPECTED_REQUIRED_CHECKS); increment 4 flips it to required once
# the measurement period shows receipts agree with hosted CI.
#
# Checkout pins the PR HEAD sha (not the synthetic merge commit) because the receipt's
# tree_hash is the tree of the commit the lane actually tested.
#
# BASE TRUST (adversarial finding on #970): the verifier and its keyring (tools/receipt_pubkey.pub
# and tools/receipt_pubkeys/*.pub) are read from the BASE tree -- the PR's base.sha (main for
# workflow_dispatch), checked out into ./base -- never from the PR head. A PR that registers a
# new signer key in its own checkout therefore cannot make its receipt verify; a key only takes
# effect once its PR has merged (docs/RECEIPT-GATE.md "Key rotation"). The head tree is still the
# tree whose hash is recomputed (--repo .).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-receipt:
    runs-on: ubuntu-latest
    # Sized for the fetch window (300s) plus checkout, pip install and the offline verify,
    # with headroom for slow gh API calls. Keep above FETCH_WINDOW_S / 60 + ~5 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout the BASE tree (verifier + keyring source of trust)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install optional Ed25519 support
        # tools/ stays stdlib-only; `cryptography` is an optional runtime import that
        # lets the verifier accept ed25519 receipts (hmac-sha256 needs nothing).
        run: pip install -r requirements-ci.txt

      - name: Fetch the local receipt for the head sha
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Bounded poll: keep looking for the receipt for FETCH_WINDOW_S seconds, every
          # FETCH_INTERVAL_S seconds, before MISSING. Max window in verify_receipt.py is 900s.
          FETCH_WINDOW_S: "300"
          FETCH_INTERVAL_S: "20"
        run: |
          set -u
          # Fail-closed: a missing receipt exits 1 ("MISSING receipt: ..." names the sha
          # and where it was looked for). A PR branch cut before this tool existed has no
          # tools/verify_receipt.py on its checked-out tree (this job pins the PR HEAD sha,
          # not main -- see header); that is also a missing receipt, not a pass.
          summary() {
            {
              echo "## verify-receipt: MISSING receipt"
              echo ""
              echo "$1"
              echo ""
              echo "Lanes post one with \`python tools/emit_receipt.py --post\`. Not required yet (docs/RECEIPT-GATE.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          # The lookup tool comes from the BASE tree too (a PR head must not be able to
          # make its own receipt lookup report "absent" or "found" on its own terms).
          if [ ! -f base/tools/verify_receipt.py ]; then
            msg="MISSING receipt: base/tools/verify_receipt.py is not present on the base checkout, so no receipt for ${HEAD_SHA} can be verified."
            echo "::error title=verify-receipt::${msg}"
            summary "${msg}"
            exit 1
          fi
          # Bounded poll (tools/verify_receipt.py poll_receipt_for_head): a lane's pre-push
          # flusher (tools/receipt_autoflush.py) posts the receipt only after the push lands on
          # GitHub, which can be minutes after a fast CI start. Keep looking for the whole window,
          # stop as soon as the receipt appears, and stay fail-closed: no receipt by the end = MISSING.
          set +e
          python base/tools/verify_receipt.py --fetch-for-head "$HEAD_SHA" --repo-slug "$GITHUB_REPOSITORY" \
            --fetch-window-s "$FETCH_WINDOW_S" --fetch-interval-s "$FETCH_INTERVAL_S" \
            --out-found receipt_found --out-envelope receipt.json
          fetch_code=$?
          set -e
          echo "found=$(cat receipt_found 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$fetch_code" -ne 0 ]; then
            echo "::error title=verify-receipt::MISSING receipt for ${HEAD_SHA} after a ${FETCH_WINDOW_S}s window (polled every ${FETCH_INTERVAL_S}s); see the step log for where it was looked for."
            summary "No \`verify-receipt-local\` receipt was found for \`${HEAD_SHA}\` within ${FETCH_WINDOW_S}s (polled every ${FETCH_INTERVAL_S}s; check-runs and commit comments)."
            exit 1
          fi
          {
            echo "## verify-receipt: receipt found within the ${FETCH_WINDOW_S}s window"
            echo ""
            echo "Fetched the \`verify-receipt-local\` receipt for \`${HEAD_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the receipt offline
        if: steps.fetch.outputs.found == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AESOP_RECEIPT_HMAC_SECRET: ${{ secrets.AESOP_RECEIPT_HMAC_SECRET }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          set +e
          # Verifier, pubkey and keyring ALL from the base tree (see BASE TRUST above).
          python base/tools/verify_receipt.py --receipt receipt.json --repo . --head "$HEAD_SHA" \
            --main-ref origin/main --max-behind 50 \
            --pubkey base/tools/receipt_pubkey.pub --keyring base/tools/receipt_pubkeys | tee verify.out
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "## verify-receipt: exit ${code}"
            echo ""
            echo '```'
            cat verify.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
