name: Regenerate On Main

# Self-heals the CLEAN-MERGE-DRIFT class of incident: two PRs can each regenerate a
# whole-tree generated artifact (tests/SUITE-COUNTS.json, tools/INDEX.md, ...) on their
# own tree, git merges the identical line cleanly, and the merged tree is still wrong
# (main carries a stale count while the file set grew) -- PR #706 and #709 both bumped
# tests/SUITE-COUNTS.json 252->253 independently, the merge was clean, and main-full went
# red only after the merge landed. Branch protection on main runs strict=false (native
# auto-merge, not serial rebase), so nothing upstream of the merge can catch this; this
# workflow re-derives every registered generated artifact AFTER a push to main and opens
# a bot PR when one drifted.
#
# NOTE ON QUOTING: tests/test_traps.py::TestCIDriftTrap lexes every non-comment line of
# every workflow file and rejects an odd number of double quotes on that line. Keep every
# line's double quotes balanced: no double-quoted string spanning lines, jq filters in
# single quotes, multi-line text via unquoted heredocs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One lane at a time: two pushes landing close together must not both decide there is
  # drift and race to open/push two different bot/regen-<run_id> branches against the
  # same stale state. Never cancelled -- each push is its own thing to verify, same
  # reasoning as main-full.yml.
  group: regen-on-main
  cancel-in-progress: false

jobs:
  regen-on-main:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # Full history: docs/INCIDENTS.md is derived from HEAD's whole log, and
          # incident_report.py refuses to write from a shallow clone.
          fetch-depth: 0

      - name: Loop guard
        id: guard
        run: |
          set -eu
          AUTHOR=$(git log -1 --format=%an)
          SUBJECT=$(git log -1 --format=%s)
          echo "triggering commit: $AUTHOR: $SUBJECT"
          if [ "$AUTHOR" = "github-actions[bot]" ] || [ "$AUTHOR" = "aesop regen-on-main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${SUBJECT#chore(regen)}" != "$SUBJECT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Run every registered regenerator (tools/regen_all.py --fix)
        id: regen
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -eu
          # pipefail: the pipe must carry regen_all's exit code, not tee's (a failed regen
          # used to report green while drift stayed on main with no alarm).
          set -o pipefail
          python tools/regen_all.py --fix --json | tee "$RUNNER_TEMP/regen-result.json"
          # Fail closed on anything but a well-formed result: exit_code must be integer 0 and
          # 'fixed' must be a list. exit_code 0 with fixed == [] is success-nothing-to-do.
          # A missing exit_code, a non-zero exit_code, malformed JSON, or a missing 'fixed'
          # key is a failed regen.
          python - "$RUNNER_TEMP/regen-result.json" > "$RUNNER_TEMP/regen-fixed.json" <<'PY' || { echo "regen result is malformed, or exit_code is missing or non-zero, or 'fixed' is missing"; exit 1; }
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              d = json.load(fh)
          code = d.get('exit_code')
          if not isinstance(code, int) or isinstance(code, bool) or code != 0:
              sys.exit(1)
          fixed = d.get('fixed')
          if not isinstance(fixed, list):
              sys.exit(1)
          print(json.dumps(fixed))
          PY
          FIXED=$(cat "$RUNNER_TEMP/regen-fixed.json")
          echo "fixed paths: $FIXED"
          if [ "$FIXED" = "[]" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the self-heal branch
        id: branch
        if: steps.guard.outputs.skip == 'false' && steps.regen.outputs.changed == 'true'
        run: |
          set -eu
          BRANCH="bot/regen-${GITHUB_RUN_ID}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          FILES=$(python -c "import json; d=json.load(open('$RUNNER_TEMP/regen-result.json')); print(', '.join(d.get('fixed', [])))")
          git add -- $(python -c "import json; d=json.load(open('$RUNNER_TEMP/regen-result.json')); print(' '.join(d.get('fixed', [])))")
          git commit -m "chore(regen): heal generated artifacts after clean-merge drift ($FILES)" -m "Co-Authored-By: aesop regen-on-main <noreply@github.com>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on the self-heal branch
        if: steps.guard.outputs.skip == 'false' && steps.regen.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ steps.branch.outputs.branch }}"

      - name: Open the self-heal PR and arm auto-merge
        if: steps.guard.outputs.skip == 'false' && steps.regen.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          BODY_FILE=$RUNNER_TEMP/regen-pr-body.md
          cat > "$BODY_FILE" <<EOF
          Automated generated-artifact self-heal from the regen-on-main workflow.

          Files regenerated:
          ${{ steps.branch.outputs.files }}

          Triggering sha on main: ${{ github.sha }}
          Run: $RUN_URL

          Merge note: this PR needs checks from a non-bot token to merge (a GITHUB_TOKEN push triggers no ci.yml run); that is the owner's decision.

          🐢 Generated with Aesop
          EOF
          PR_URL=$(gh pr create --title "chore(regen): heal generated artifacts" --body-file "$BODY_FILE" --head "${{ steps.branch.outputs.branch }}" --base main)
          echo "opened: $PR_URL"
          gh pr merge --auto --squash "$PR_URL"
